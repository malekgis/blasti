<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>بلاصتي – وقود تمنراست</title>
<meta name="description" content="احجز بلاصتك في طابور الوقود: صوّر لوحة مركبتك، خذ رقمك ورمز QR، وادخل من الحاجز في وقتك.">
<meta name="theme-color" content="#283C8C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;800&display=swap">
<link rel="stylesheet" href="css/style.css">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0} img{max-width:100%} [hidden]{display:none!important}</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect x="2" y="2" width="36" height="36" rx="10" fill="var(--indigo)"/><path d="M20 9c-4.5 6-7 9.6-7 13a7 7 0 0 0 14 0c0-3.4-2.5-7-7-13z" fill="var(--on-indigo)"/><text x="20" y="26.5" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-weight="600" font-size="9" fill="var(--indigo)">20</text></svg>
      <div><h1 data-app-name>بلاصتي</h1><small data-app-tagline>بلاصتك في طابور الوقود · ولاية تمنراست</small></div>
    </div>
    <span class="pilot">نسخة العرض</span>
  </header>
  <nav class="roles" aria-label="الواجهات">
    <a href="#register" data-view="register">التسجيل</a>
    <a href="#gate" data-view="gate">الحاجزان</a>
    <a href="#manager" data-view="manager">مدير المحطة</a>
    <a href="#wilaya" data-view="wilaya">الولاية / نفطال</a>
    <a href="#qr" data-view="qr">ملصقات QR</a>
  </nav>
  <main id="app"><div class="narrow"><div class="row"><div class="spinner"></div><span>جارٍ التحميل…</span></div></div></main>
</div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<div id="toast" class="toast" role="status" hidden></div>

<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/api-demo.js"></script>
<script src="js/api-supabase.js"></script>
<script src="js/app.js"></script>

</html>
